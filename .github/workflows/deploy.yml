name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права, нужные для деплоя в Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Один активный деплой; новые пуши отменяют предыдущий незавершённый.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (static export)
        env:
          GITHUB_PAGES: "true"
          # true — когда в Settings → Pages подключён домен tgmarket.ai (переменная репозитория CUSTOM_DOMAIN)
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: npm run build

      - name: CNAME для своего домена
        if: ${{ vars.CUSTOM_DOMAIN == 'true' }}
        run: echo "tgmarket.ai" > out/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
